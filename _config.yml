title: "Senchabot Blog"
tagline: "Haberler, Güncellemeler ve Kullanım Rehberleri"
description: "Senchabot hakkında en son güncellemeler, yayıncılar için ipuçları ve detaylı kullanım rehberleri."
url: "https://blog.senchabot.com"
baseurl: ""

# -------------------------------------------
# Author Information
# -------------------------------------------
author:
  name: "M. Rasit Durmus"
  avatar: "/assets/images/avatar.jpg"
  bio: "Yazılımcı ve Senchabot'un geliştiricisi."
  links:
    linkedin: "https://linkedin.com/in/mrdurmus"
    github: "https://github.com/rasitds"
    twitter: "https://x.com/rasitds"
    instagram: "https://instagram.com/rasit.builds"

# -------------------------------------------
# Build Settings
# -------------------------------------------
markdown: kramdown
highlighter: rouge

# -------------------------------------------
# Collections (Custom Content Types)
# -------------------------------------------
collections:
  guides:
    output: true

# -------------------------------------------
# Defaults (Multi-Language Routing & Permalinks)
# -------------------------------------------
defaults:
  # --- REHBERLER (_guides) ---
  - scope:
      path: "_guides/en"
      type: "guides"
    values:
      lang: "en"
      permalink: /en/guides/:title/
  - scope:
      path: "_guides/tr"
      type: "guides"
    values:
      lang: "tr"
      permalink: /guides/:title/

  # --- BLOG YAZILARI (_posts) ---
  - scope:
      path: "_posts/en"
      type: "posts"
    values:
      lang: "en"
      permalink: /en/posts/:title/
  - scope:
      path: "_posts/tr"
      type: "posts"
    values:
      lang: "tr"
      permalink: /posts/:title/

# -------------------------------------------
# Plugins & Exclusions
# -------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  # jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
